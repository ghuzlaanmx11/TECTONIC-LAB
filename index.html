<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tectonic Lab - مختبر الصفائح التكتونية</title>
    <!-- ربط ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- حاضنة العرض أو الخريطة التكتونية (تدمج لغة SVG البرمجية للرسومات التفاعلية) -->
    <div id="canvas-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
            <!-- خلفية الفضاء العميق للمختبر -->
            <rect width="1000" height="600" fill="#030712"/>
            
            <!-- خطوط الشبكة التكتونية المتحركة (رسومات متجهة SVG) -->
            <path d="M 100,300 Q 300,200 500,300 T 900,300" stroke="rgba(56, 189, 248, 0.2)" stroke-width="3" fill="none"/>
            <path d="M 150,450 Q 400,350 650,450 T 950,450" stroke="rgba(244, 63, 94, 0.2)" stroke-width="2" fill="none"/>
            
            <!-- عناصر بصرية متجهة تفاعلية تمثل نطاق النشاط -->
            <g transform="translate(500, 300)">
                <circle r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5">
                    <animate attributeName="r" values="40;90;40" dur="4s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite"/>
                </circle>
                <circle r="8" fill="#38bdf8"/>
            </g>
        </svg>
    </div>

    <!-- لوحة التحكم الزجاجية الاحترافية -->
    <div class="glass-panel control-panel">
        <div class="panel-header">
            <h1>مختبر التكتونية</h1>
            <p class="subtitle">نظام محاكاة الصفائح الأرضية التفاعلي</p>
        </div>

        <!-- أزرار التبديل المرتبطة بملف الجافاسكريبت والـ JSON -->
        <div class="btn-group">
            <button class="control-btn active" data-mode="divergent">
                <span>الحركة التباعدية</span>
                <small>Divergent Boundaries</small>
            </button>
            <button class="control-btn" data-mode="convergent">
                <span>الحركة التقاربية</span>
                <small>Convergent Boundaries</small>
            </button>
            <button class="control-btn" data-mode="transform">
                <span>الانزلاق التحويلي</span>
                <small>Transform Faults</small>
            </button>
        </div>

        <!-- بطاقة المعلومات العلمية (تتحدث ديناميكياً من data.json) -->
        <div class="scientific-card">
            <h3 id="sci-title">الحركة التباعدية (انتشار قاع المحيط)</h3>
            <p id="sci-desc">تتباعد الصفيحتان التكتونيتان نتيجة تيارات الحمل الصاعدة في الوشاح، مما يسمح للماغما بالصعود والتصلب لتكوين قشرة محيطية جديدة.</p>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت البرمجي -->
    <script src="script.js"></script>
</body>
</html>
