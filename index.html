<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tectonic Lab - مختبر التكتونية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنبيه العلوي -->
    <div class="top-hint">
        👆 اسحب بإصبعك لتدوير المشهد • 🔍 قرّب بإصبعين للتكبير
    </div>

    <!-- لوحة التحكم الجانبية العائمة -->
    <div class="control-panel">
        <h1>TECTONIC LAB</h1>
        <p>المختبر الافتراضي لتفاعل الصفح التكتونية</p>
        
        <div class="btn-group">
            <button class="control-btn">
                <span>الحركة التباعدية</span>
                <small>Divergent</small>
            </button>
            <button class="control-btn">
                <span>الحركة التقاربية والاندساس</span>
                <small>Subduction</small>
            </button>
            <button class="control-btn">
                <span>الانزلاق التحويلي</span>
                <small>Transform</small>
            </button>
        </div>

        <div style="font-size: 0.8rem; color: #64748b; text-align: center; margin-top: 10px;">
            إعداد المهندسة: غزلان المشيوف | الصف: ثالث متوسط
        </div>
    </div>

    <!-- هنا يتم وضع كود Three.js أو المشهد الثلاثي الأبعاد الخاص بك -->
    <script src="script.js"></script>
</body>
</html>
